version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "30095:80"
    depends_on:
      - backend
    networks:
      - bg-remover-network
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "30096:8000"
    environment:
      - TOOL_NAME=bg-remover
    networks:
      - bg-remover-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  bg-remover-network:
    driver: bridge
